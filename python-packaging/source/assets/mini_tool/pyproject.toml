[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wordmeter"
version = "0.1.0"
description = "统计文本行数、词数与字符数的命令行工具"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wordmeter contributors" }]
keywords = ["text", "cli", "statistics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wordmeter = "wordmeter.cli:main"

[project.urls]
Homepage = "https://example.com/wordmeter"
Documentation = "https://example.com/wordmeter/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wordmeter = ["py.typed"]
